<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"KeySans";src:url(fonts/Mitr-Bold.ttf)}
@font-face{font-family:"KeySerif";src:url(fonts/Sriracha-Regular.ttf)}
@font-face{font-family:"Lead";src:url(fonts/Mitr-Regular.ttf)}
@font-face{font-family:"CardSans";src:url(fonts/Mitr-SemiBold.ttf)}
/* editorial palette — accent is the ONLY colour; everything else is white / navy / cream / black */
:root{--acc:#DDFF45;--navy:#14213D;--cream:#F2EDE2;--ink:#050505;--pill:#1B2A52}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{position:relative;color:#fff;font-family:"Lead",sans-serif}
#v{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 45%}   /* NO colour grade: footage stays as shot */
.layer{position:absolute;inset:0;pointer-events:none}

/* ---------- typography ---------- */
.cap{position:absolute;left:60px;width:960px;display:flex;flex-direction:column;align-items:center;opacity:0}
.ln{display:flex;align-items:baseline;justify-content:center;flex-wrap:nowrap;white-space:nowrap;column-gap:16px}
.ch{display:inline-block;white-space:nowrap;position:relative;opacity:0;will-change:transform,opacity,filter}
.g{display:inline-block}
.l {font-family:"Lead";font-size:54px;line-height:1.2;color:#fff}
.m {font-family:"CardSans";font-size:84px;line-height:1.12;color:#fff;letter-spacing:-1px}
.k ,.kw{font-family:"KeySans";font-size:146px;line-height:1.12;letter-spacing:-2px;color:var(--acc)}
.kw{color:#fff}
.i ,.iw{font-family:"KeySerif";font-size:150px;line-height:1.2;color:var(--acc)}
.iw{color:#fff}
.hl{font-family:"KeySans";font-size:116px;line-height:1.1;letter-spacing:-2px;color:#0A0A0A;background:var(--acc);padding:0 .16em .04em;border-radius:12px}
.aroll .ch{text-shadow:0 4px 26px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.45)}
.aroll .hl{text-shadow:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}

/* ---------- card parts ---------- */
.card{position:absolute;inset:0;overflow:hidden;opacity:0}
.stage{position:absolute;inset:0}
.pill{position:absolute;white-space:nowrap;display:inline-flex;align-items:center;gap:18px;padding:12px 40px 18px;border-radius:999px;background:var(--pill);
  box-shadow:0 14px 36px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);font-family:"KeySerif";font-size:58px;color:#fff;opacity:0}
.num{position:absolute;width:96px;height:96px;display:flex;align-items:center;justify-content:center;opacity:0}
.num::before{content:"";position:absolute;inset:8px;background:var(--acc);transform:rotate(45deg);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.num span{position:relative;font-family:"KeySans";font-size:54px;color:#0A0A0A;line-height:1}
.strike{position:absolute;left:-4%;width:108%;top:48%;height:12px;border-radius:6px;background:var(--acc);transform-origin:0 50%}
</style></head>
<body>
<div class="layer" id="B"></div>
<img id="v">
<div class="layer" id="S"></div>
<div class="layer" id="g"></div>
<div class="layer" id="flash" style="background:#fff;opacity:0"></div>
<script>
/* ===================== CORE ===================== */
const G = document.getElementById('g'), S = document.getElementById('S'), B = document.getElementById('B');
const SFX = [], ZOOM = [], HOOKS = [], FITS = [], FRAMES = [], ANIMS = [];
const ms = s => s * 1000;
const sfx = (s, t, db = -14, pitch) => SFX.push(pitch ? {s, t, db, pitch} : {s, t, db});
/* calm mix (user: fewer, quieter effects) — what reaches the audio track: no small pops/ticks (the motion carries them),
   then the strongest cue wins inside any SFX_GAP window (sub > stamp/thud > whoosh > swipe > softswish) */
const SFX_GAP = 0.9, SFX_RANK = {sub: 5, stamp: 4, thud: 4, whoosh: 3, whoosh_long: 3, swipe: 2, softswish: 1};
function calmSfx(list) {
  const kept = [];
  list.filter(c => SFX_RANK[c.s]).sort((a, b) => SFX_RANK[b.s] - SFX_RANK[a.s] || a.t - b.t)
    .forEach(c => { if (!kept.some(k => Math.abs(k.t - c.t) < SFX_GAP)) kept.push(c); });
  return kept.sort((a, b) => a.t - b.t);
}
const zoom = (t, z, d = .001) => ZOOM.push({t, z, d});            // default = hard punch-in cut (editorial style)
const SPRING = 'cubic-bezier(.22,1.3,.36,1)', SMOOTH = 'cubic-bezier(.2,.8,.2,1)', INOUT = 'cubic-bezier(.65,0,.35,1)';
/* every animation is registered: document.getAnimations() drops finished fill:'none' ones, which breaks backward seeks */
const A = (el, kf, t, d, o = {}) => { const a = el.animate(kf, {delay: ms(t), duration: ms(d), easing: o.e ?? SMOOTH, fill: o.f ?? 'both', iterations: o.it ?? 1, direction: o.dir ?? 'normal'}); ANIMS.push(a); return a; };
const div = (css, parent, html = '') => { const d = document.createElement('div'); d.style.cssText = 'position:absolute;' + css; d.innerHTML = html; parent.appendChild(d); return d; };
const seg = new Intl.Segmenter('th', {granularity: 'grapheme'});
const graphemes = s => [...seg.segment(s)].map(x => x.segment);
const ACC = '#DDFF45', NAVY = '#14213D', CREAM = '#F2EDE2', INK = '#050505';
const visible = (el, t0, t1) => A(el, [{opacity: 1}, {opacity: 1}], t0, t1 - t0, {f: 'none', e: 'linear'});   // shown only inside [t0,t1)

/* one chunk of words.  style: l | m | k | kw | i | iw | hl
   reveal: lead words fade-up out of a blur; key words pop (scale 1.14→1 + blur→sharp).
   o.type  = typewriter, grapheme by grapheme ·  o.wipe = graphemes turn white→accent one by one (after appearing) */
function chunk(parent, txt, st, t, o = {}) {
  const c = document.createElement('span'); c.className = 'ch ' + st; parent.appendChild(c);
  if (o.color) c.style.color = o.color;
  if (o.size) c.style.fontSize = o.size + 'px';
  const big = /^(k|kw|i|iw|hl)$/.test(st);
  if (o.type || o.wipe) {
    c.style.opacity = 1;
    graphemes(txt).forEach((ch, n) => {
      const g = document.createElement('span'); g.className = 'g'; g.textContent = ch; c.appendChild(g);
      const tg = t + n * (o.step ?? .045);
      A(g, [{opacity: 0, filter: 'blur(6px)'}, {opacity: 1, filter: 'blur(0)'}], tg, .12, {e: 'ease-out'});
      if (o.wipe) A(g, [{color: '#FFFFFF'}, {color: o.wipe === true ? ACC : o.wipe}], tg + .10, .12, {e: 'linear'});
    });
  } else {
    c.textContent = txt;
    if (big) A(c, [{opacity: 0, transform: 'scale(1.16)', filter: 'blur(14px)'}, {opacity: 1, transform: 'scale(1)', filter: 'blur(0)'}], t, .26, {e: SMOOTH});
    else A(c, [{opacity: 0, transform: 'translateY(16px)', filter: 'blur(7px)'}, {opacity: 1, transform: 'none', filter: 'blur(0)'}], t, .2, {e: SMOOTH});
  }
  return c;
}
function lines(parent, rows) {      // rows: [[ [txt, style, t, opts], ... ], ...]
  for (const r of rows) { const L = document.createElement('div'); L.className = 'ln'; parent.appendChild(L); for (const [txt, st, t, o] of r) chunk(L, txt, st, t, o ?? {}); }
}
/* A-roll caption block over the chest (top = y of first line). Hidden automatically inside card/frame windows. */
function cap(b) {
  const el = div(`top:${b.top ?? 1150}px`, G); el.className = 'cap aroll';
  if (inCard(b.t0)) el.style.display = 'none';
  lines(el, b.lines);
  FITS.push(() => fit(el, 960, b.maxH ?? 420));
  visible(el, b.t0, b.t1);
  return el;
}
function fit(el, W, H) {
  for (const L of el.children) { const w = L.scrollWidth; if (w > W) L.style.transform = `scale(${W / w})`; }
  if (H && el.offsetHeight > H) { el.style.transformOrigin = '50% 0'; el.style.transform = `scale(${H / el.offsetHeight})`; }
}
const keyHit = (t, db = -22) => sfx('softswish', t - .04, db);

/* ===================== CARDS (full-screen inserts) ===================== */
const CARD_WIN = [], MADE = [];   // MADE = t0 of every card()/frame() actually built (checked against CARD_WIN on first seek)
const cards = w => CARD_WIN.push(...w);           // declare every card/frame window FIRST
const inCard = t => CARD_WIN.some(([a, b]) => t >= a - .01 && t < b);
const BG = {black: INK, white: '#FFFFFF', cream: CREAM, navy: '#0B1530'};
/* card(): hard cut in at t0, hard cut out at t1; contents settle 1.035→1 */
function card(t0, t1, {bg = 'black', sound = 'whoosh', db = -24} = {}) {
  MADE.push(t0);
  const root = div(`inset:0;background:${BG[bg] ?? bg}`, S); root.className = 'card';
  visible(root, t0, t1);
  const st = div('inset:0', root); st.className = 'stage';
  A(st, [{transform: 'scale(1.035)'}, {transform: 'scale(1)'}], t0, .45, {e: SMOOTH});
  if (sound) sfx(sound, t0 - .06, db);
  st.t0 = t0; st.t1 = t1;
  return st;
}
/* centred text line(s) on a card.  css positions the block (top:...).  colour of l/kw/iw defaults to white; pass {color} per chunk for navy */
function txt(c, rows, css = 'top:800px', {W = 960, H} = {}) {
  const el = div(`left:${(1080 - W) / 2}px;width:${W}px;display:flex;flex-direction:column;align-items:center;${css}`, c);
  lines(el, rows); FITS.push(() => fit(el, W, H)); return el;
}
/* picture: anim 'blur' (defocus→sharp) | 'up' | 'right' | 'left'; drift = slow push-in over the card */
function pic(c, src, t, css, {anim = 'blur', drift = .05, d = .5} = {}) {
  const w = div(css + ';overflow:visible', c), im = document.createElement('img'); im.src = src; im.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block'; w.appendChild(im);
  const from = {blur: 'scale(1.06)', up: 'translateY(160px)', right: 'translateX(420px)', left: 'translateX(-420px)'}[anim];
  A(w, [{opacity: 0, transform: from, filter: 'blur(18px)'}, {opacity: 1, transform: 'none', filter: 'blur(0)'}], t, d, {e: anim === 'blur' ? SMOOTH : SPRING});
  if (drift && c.t1) A(im, [{transform: 'scale(1)'}, {transform: `scale(${1 + drift})`}], c.t0, c.t1 - c.t0, {e: 'linear'});
  return w;
}
/* video B-roll: frames pre-extracted by scripts/prep_broll.sh into <project>/broll/<name>/f00001.jpg …
   plays from clip second `from` starting at card time t. Same entrance options as pic(). */
function clip(c, name, t, css, {from = 0, anim = 'blur', fit = 'cover', d = .45} = {}) {
  const w = div(css + ';overflow:hidden', c), im = document.createElement('img'); im.style.cssText = `width:100%;height:100%;object-fit:${fit};display:block`; w.appendChild(im);
  const fr = {blur: 'scale(1.06)', up: 'translateY(160px)', right: 'translateX(420px)', left: 'translateX(-420px)'}[anim];
  A(w, [{opacity: 0, transform: fr, filter: 'blur(18px)'}, {opacity: 1, transform: 'none', filter: 'blur(0)'}], t, d, {e: anim === 'blur' ? SMOOTH : SPRING});
  let last = '';
  HOOKS.push(tt => {
    if (tt < c.t0 - .05 || tt > c.t1 + .05) return;
    const n = Math.max(1, Math.round((tt - t + from) * 30) + 1), src = `broll/${name}/f${String(n).padStart(5, '0')}.jpg`;
    if (src === last) return; last = src; im.src = src; return im.decode().catch(() => {});
  });
  return w;
}
function pill(c, text, t, css, {sound = true} = {}) {
  const p = div(css, c, text); p.className = 'pill';
  A(p, [{opacity: 0, transform: 'translateY(40px) scale(.92)', filter: 'blur(8px)'}, {opacity: 1, transform: 'none', filter: 'blur(0)'}], t, .32, {e: SPRING});
  if (sound) sfx('pop_lo', t, -27);
  return p;
}
function strike(chunkEl, t, color) {          // line drawn through a chunk (e.g. "ไม่ใช่ส่วนลด")
  const s = document.createElement('div'); s.className = 'strike'; if (color) s.style.background = color; chunkEl.appendChild(s);
  A(s, [{transform: 'scaleX(0)'}, {transform: 'scaleX(1)'}], t, .24, {e: INOUT});
  sfx('swipe', t, -24);
  return s;
}
function num(c, n, t, css) {
  const b = div(css, c, `<span>${n}</span>`); b.className = 'num';
  A(b, [{opacity: 0, transform: 'scale(.4) rotate(-30deg)'}, {opacity: 1, transform: 'none'}], t, .34, {e: SPRING});
  sfx('pop', t, -26); return b;
}
function curl(c, t, color = '#000') {        // thin black page-curl crescents in two corners (poster look)
  const tr = div('right:0;top:0', c, `<svg width="170" height="170" viewBox="0 0 170 170"><path d="M170 0H0Q140 22 170 170Z" fill="${color}"/></svg>`);
  const bl = div('left:0;bottom:0', c, `<svg width="210" height="210" viewBox="0 0 210 210"><path d="M0 0V210H210Q34 180 0 0Z" fill="${color}"/></svg>`);
  for (const [e, f] of [[tr, 'translate(90px,-90px)'], [bl, 'translate(-110px,110px)']]) A(e, [{transform: f}, {transform: 'none'}], t, .45, {e: SMOOTH});
}
/* frame(): the talking head shrinks into a rounded card on a flat background (ref transition).
   Returns a transparent container (above the video) for text around the card. */
function frame(t0, t1, {bg = 'cream', s = .5, y = 1040, r = 44, d = .38} = {}) {
  MADE.push(t0);
  const back = div(`inset:0;background:${BG[bg] ?? bg};opacity:0`, B); visible(back, t0, t1);
  const sh = div('opacity:0;border-radius:44px;box-shadow:0 40px 90px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.2);background:#000', B); visible(sh, t0, t1);
  FRAMES.push({t0, t1, s, y, r, d, sh});
  const box = div('inset:0;opacity:0', S); visible(box, t0, t1);
  sfx('whoosh', t0 - .05, -23);
  box.t0 = t0; box.t1 = t1;
  return box;
}
/* ===================== OVERLAY WIDGETS (editorial-overlay style) =====================
   widget(): a small pop-up box on the caption layer (above the video, NOT zoomed with the camera).
   The speaker stays on screen the whole clip — never use card()/frame()/mood() in this style. */
const WIDGETS = [];
function widget(css, t0, t1, {card = 'white', radius = 40, sound = 'softswish', db = -25} = {}) {
  const w = div(css + ';opacity:0', G);
  if (card) w.style.cssText += {white: ';background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.45),0 4px 12px rgba(0,0,0,.25)',
    navy: ';background:#14213D;box-shadow:0 24px 60px rgba(0,0,0,.45)', accent: `;background:${ACC};box-shadow:0 24px 60px rgba(0,0,0,.45)`}[card] + `;border-radius:${radius}px`;
  A(w, [{opacity: 0, transform: 'translateY(46px) scale(.78)'}, {opacity: 1, transform: 'none'}], t0, .48, {e: BOUNCE});
  A(w, [{opacity: 1, transform: 'none'}, {opacity: 0, transform: 'scale(.86)'}], t1 - .16, .16, {f: 'forwards', e: 'ease-in'});
  if (sound) sfx(sound, t0 - .03, db);
  w.t0 = t0; w.t1 = t1; WIDGETS.push([t0, t1]);
  return w;
}
/* flat label inside a widget (Mitr, no blur, no shadow) */
function label(parent, text, t, css, {size = 40, color = NAVY, font = 'CardSans', d = .3} = {}) {
  const l = div(`white-space:nowrap;font-family:${font};font-size:${size}px;line-height:1.15;color:${color};opacity:0;${css}`, parent); l.textContent = text;
  A(l, [{opacity: 0, transform: 'translateY(14px)'}, {opacity: 1, transform: 'none'}], t, d);
  return l;
}
/* flat chip: icon + text on accent / white / navy */
function chipW(parent, icon, text, t, css, {bg = ACC, color = '#0A0A0A', size = 44, drop = false} = {}) {
  const c = div(`display:flex;align-items:center;gap:14px;padding:12px 30px 16px 22px;border-radius:999px;background:${bg};color:${color};font-family:KeySans;font-size:${size}px;white-space:nowrap;box-shadow:0 14px 34px rgba(0,0,0,.35);opacity:0;${css}`, parent,
    (icon ? ico(icon, size * 1.05, color, 2.2) : '') + `<span>${text}</span>`);
  A(c, [{opacity: 0, transform: drop ? 'translateY(-260px) rotate(-14deg)' : 'scale(.4)'}, {opacity: 1, transform: drop ? 'rotate(-5deg)' : 'none'}], t, drop ? .5 : .4, {e: BOUNCE});
  sfx(drop ? 'thud' : 'pop_lo', drop ? t + .28 : t, drop ? -24 : -27);
  return c;
}
const flash = (t, o = .7) => A(document.getElementById('flash'), [{opacity: o}, {opacity: 0}], t, .16, {f: 'none', e: 'ease-out'});

/* ===================== MOTION GRAPHICS KIT (Jitter × Swishy) =====================
   Used when the user gives no B-roll. Flat rounded UI shapes + Lucide line icons (Jitter) with springy overshoot,
